verify_jwt = false

# Scheduled formal-notice agent authenticates its dedicated Vault identity.
[functions.legal-notice-agent]
verify_jwt = false

# Scheduled document-request agent authenticates with its dedicated Vault identity.
[functions.missing-contract-pdf-agent]
verify_jwt = false

[functions.upload-missing-contract-pdf]
verify_jwt = false

