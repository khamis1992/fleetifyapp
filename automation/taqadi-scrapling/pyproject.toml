[project]
name = "fleetify-taqadi-scrapling"
version = "0.1.0"
description = "Local adaptive-selector memory for the Fleetify Taqadi agent"
requires-python = ">=3.10"
dependencies = [
  "scrapling==0.4.15",
]

[project.scripts]
taqadi-scrapling = "taqadi_scrapling.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taqadi_scrapling"]

